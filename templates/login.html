{% extends "base.html" %}

{% block title %}Login - Greeni5 Nursery{% endblock %}

{% block content %}
<div class="container" style="padding-top: 4rem; padding-bottom: 5rem; max-width: 480px;">

  <div style="background: #ffffff; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 2.5rem; box-shadow: var(--shadow);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-logo" style="justify-content: center; margin-bottom: 0.5rem;">
        <div class="leaf-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 20h10"/>
            <path d="M10 20c0-4.4 2-8 7-8"/>
            <path d="M14 12c-3.5 0-6.5-2.5-7-6 4 0 7 2 7 6Z" fill="rgba(255,255,255,0.25)"/>
            <path d="M10 20v-3"/>
          </svg>
        </div>
        <span>Greeni5</span>
      </div>
      <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--text-main);">Welcome Back</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Sign in to access your orders, cart, and dashboard</p>
    </div>

    <form action="{{ url_for('login', next=request.args.get('next')) }}" method="POST">
      <div style="margin-bottom: 1.25rem;">
        <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem;">Email Address</label>
        <input type="email" id="login-email" name="email" required placeholder="you@example.com" style="width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem;">
      </div>

      <div style="margin-bottom: 1.5rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;">
          <label style="font-size: 0.85rem; font-weight: 600;">Password</label>
          <a href="{{ url_for('forgot_password') }}" style="font-size: 0.8rem; color: var(--primary); font-weight: 600;">Forgot Password?</a>
        </div>
        <input type="password" id="login-password" name="password" required placeholder="••••••••" style="width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem;">
      </div>

      <button type="submit" class="btn btn-primary btn-lg btn-block">
        Sign In to Account
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--text-muted);">
      Don't have a Greeni5 account yet? 
      <a href="{{ url_for('register') }}" style="color: var(--primary); font-weight: 700;">Sign Up</a>
    </div>
  </div>

</div>
{% endblock %}
