{% extends "base.html" %}

{% block title %}Page Not Found (404) - Greeni5 Nursery{% endblock %}

{% block content %}
<div class="container" style="padding-top: 5rem; padding-bottom: 6rem; text-align: center; max-width: 650px;">
  <div style="width: 88px; height: 88px; border-radius: 50%; background: rgba(22, 163, 74, 0.12); color: var(--primary); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem auto;">
    <i data-lucide="compass" style="width: 44px; height: 44px;"></i>
  </div>
  <h1 style="font-size: 2.8rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.5rem;">404 - Lost in the Garden</h1>
  <p style="color: var(--text-muted); font-size: 1.1rem; line-height: 1.7; margin-bottom: 2rem;">
    Oops! The botanical path you are trying to reach has overgrown or moved to a new greenhouse location.
  </p>

  <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
    <a href="{{ url_for('catalog') }}" class="btn btn-primary btn-lg">
      <i data-lucide="sprout" style="width: 18px;"></i> Explore Plant Catalog
    </a>
    <a href="{{ url_for('index') }}" class="btn btn-outline btn-lg">
      Return Home
    </a>
  </div>
</div>
{% endblock %}
