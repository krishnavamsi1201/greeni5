{% extends "base.html" %}

{% block title %}Forgot Password - Greeni5 Nursery{% endblock %}

{% block content %}
<div class="container" style="padding-top: 4rem; padding-bottom: 5rem; max-width: 480px;">

  <div style="background: #ffffff; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 2.5rem; box-shadow: var(--shadow);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="width: 56px; height: 56px; border-radius: 50%; background: #fef3c7; color: #d97706; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem auto;">
        <i data-lucide="key" style="width: 28px; height: 28px;"></i>
      </div>
      <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--text-main);">Reset Password</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Enter your registered account email to receive a password recovery link.</p>
    </div>

    <form action="{{ url_for('forgot_password') }}" method="POST">
      <div style="margin-bottom: 1.5rem;">
        <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem;">Email Address</label>
        <input type="email" name="email" required placeholder="you@example.com" style="width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem;">
      </div>

      <button type="submit" class="btn btn-primary btn-lg btn-block">
        Send Reset Link
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem;">
      <a href="{{ url_for('login') }}" style="color: var(--primary); font-size: 0.9rem; font-weight: 600;">
        ← Back to Login
      </a>
    </div>
  </div>

</div>
{% endblock %}
