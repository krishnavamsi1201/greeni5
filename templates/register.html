{% extends "base.html" %}

{% block title %}Register Account - Greeni5 Nursery{% endblock %}

{% block content %}
<div class="container" style="padding-top: 4rem; padding-bottom: 5rem; max-width: 480px;">

  <div style="background: #ffffff; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 2.5rem; box-shadow: var(--shadow);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-logo" style="justify-content: center; margin-bottom: 0.5rem;">
        <div class="leaf-icon"><i data-lucide="sprout"></i></div>
        <span>Greeni5</span>
      </div>
      <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--text-main);">Create Your Account</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Join over 10,000 satisfied plant parents across India</p>
    </div>

    <form action="{{ url_for('register') }}" method="POST">
      <div style="margin-bottom: 1.25rem;">
        <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem;">Full Name *</label>
        <input type="text" name="name" required placeholder="e.g. Ananya Roy" style="width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem;">
      </div>

      <div style="margin-bottom: 1.25rem;">
        <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem;">Email Address *</label>
        <input type="email" name="email" required placeholder="you@example.com" style="width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem;">
      </div>

      <div style="margin-bottom: 1.25rem;">
        <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem;">Phone Number (Optional)</label>
        <input type="tel" name="phone" placeholder="+91 98765 43210" style="width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem;">
      </div>

      <div style="margin-bottom: 1.25rem;">
        <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem;">Password (Min 6 characters) *</label>
        <input type="password" name="password" required minlength="6" placeholder="••••••••" style="width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem;">
      </div>

      <div style="margin-bottom: 1.75rem;">
        <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem;">Confirm Password *</label>
        <input type="password" name="confirm_password" required minlength="6" placeholder="••••••••" style="width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem;">
      </div>

      <button type="submit" class="btn btn-primary btn-lg btn-block">
        Create My Greeni5 Account
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--text-muted);">
      Already have an account? 
      <a href="{{ url_for('login') }}" style="color: var(--primary); font-weight: 700;">Log In</a>
    </div>
  </div>

</div>
{% endblock %}
